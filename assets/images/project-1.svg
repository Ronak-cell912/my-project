<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#0F172A"/>
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="100" y1="100" x2="700" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  <rect width="800" height="500" fill="url(#grid1)"/>
  
  <!-- Dashboard UI Mockup Frame -->
  <g transform="translate(60, 40)">
    <!-- Window Bar -->
    <rect width="680" height="420" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect width="680" height="36" rx="12" fill="#0F172A"/>
    <circle cx="24" cy="18" r="5" fill="#EF4444"/>
    <circle cx="42" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="18" r="5" fill="#10B981"/>
    <text x="86" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">mediscan-ai-diagnostic-hub / inference-engine-v3.4</text>
    <rect x="550" y="10" width="110" height="18" rx="4" fill="#0284C7" fill-opacity="0.2"/>
    <text x="560" y="22" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="600">STATUS: 99.4% ACC</text>

    <!-- Main Scan Canvas -->
    <rect x="20" y="55" width="400" height="345" rx="8" fill="#0B1120" stroke="#1E293B"/>
    <!-- Medical Wireframe CT Simulation -->
    <circle cx="220" cy="225" r="130" fill="none" stroke="#1E293B" stroke-dasharray="4 4" stroke-width="2"/>
    <ellipse cx="220" cy="225" rx="105" ry="85" fill="none" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="220" cy="225" rx="80" ry="65" fill="none" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- Neural Hotspot Bounding Boxes -->
    <rect x="170" y="150" width="100" height="75" rx="4" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="220" cy="185" r="4" fill="#38BDF8"/>
    <text x="175" y="142" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="600">Region A [Confidence: 99.4%]</text>

    <rect x="250" y="260" width="70" height="50" rx="4" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.5"/>
    <text x="252" y="253" fill="#34D399" font-family="monospace" font-size="9">Region B [Nominal]</text>

    <!-- Crosshair Target -->
    <line x1="220" y1="70" x2="220" y2="380" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="35" y1="225" x2="405" y2="225" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Side Analysis Panel -->
    <g transform="translate(440, 55)">
      <rect width="220" height="80" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="16" y="26" fill="#94A3B8" font-family="system-ui" font-size="11">Inference Latency</text>
      <text x="16" y="54" fill="#F8FAFC" font-family="system-ui" font-size="22" font-weight="700">18.4 ms</text>
      <text x="108" y="54" fill="#10B981" font-family="system-ui" font-size="12" font-weight="600">↓ 64% TensorRT</text>

      <rect y="95" width="220" height="85" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="16" y="120" fill="#94A3B8" font-family="system-ui" font-size="11">DICOM Batch Processed</text>
      <text x="16" y="150" fill="#F8FAFC" font-family="system-ui" font-size="22" font-weight="700">142,500+</text>
      <text x="142" y="150" fill="#38BDF8" font-family="system-ui" font-size="12" font-weight="600">Zero Err</text>

      <!-- Mini Chart -->
      <rect y="195" width="220" height="150" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="16" y="220" fill="#94A3B8" font-family="system-ui" font-size="11">Loss & Convergence Curve</text>
      <path d="M 16 320 Q 70 290 110 260 T 205 240" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <path d="M 16 320 Q 70 290 110 260 T 205 240 L 205 330 L 16 330 Z" fill="url(#accentGrad1)" fill-opacity="0.1"/>
      <line x1="16" y1="330" x2="205" y2="330" stroke="#334155" stroke-width="1"/>
      <circle cx="205" cy="240" r="3.5" fill="#38BDF8"/>
    </g>
  </g>
</svg>