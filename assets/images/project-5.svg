<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#0F172A"/>
  <defs>
    <linearGradient id="finGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1B4B"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#finGrad)"/>

  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#0B1120" stroke="#312E81" stroke-width="1.5"/>
    <rect width="680" height="36" rx="12" fill="#1E1B4B"/>
    <circle cx="24" cy="18" r="5" fill="#EF4444"/>
    <circle cx="42" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="18" r="5" fill="#10B981"/>
    <text x="86" y="22" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="500">finstream-engine / distributed-consensus-ledger-lmax</text>
    <rect x="545" y="10" width="115" height="18" rx="4" fill="#4F46E5" fill-opacity="0.3"/>
    <text x="555" y="22" fill="#818CF8" font-family="monospace" font-size="10" font-weight="600">0.38ms LATENCY</text>

    <!-- Candlestick & Order Book Telemetry -->
    <g transform="translate(30, 60)">
      <rect width="360" height="325" rx="8" fill="#0F172A" stroke="#1E293B"/>
      <text x="20" y="30" fill="#E2E8F0" font-family="system-ui" font-size="12" font-weight="600">High-Frequency Matching Engine</text>

      <!-- Candlesticks / volume bars -->
      <g transform="translate(30, 50)">
        <!-- Bars -->
        <line x1="30" y1="30" x2="30" y2="160" stroke="#10B981" stroke-width="1"/>
        <rect x="23" y="60" width="14" height="70" rx="2" fill="#10B981"/>

        <line x1="75" y1="20" x2="75" y2="180" stroke="#10B981" stroke-width="1"/>
        <rect x="68" y="45" width="14" height="85" rx="2" fill="#10B981"/>

        <line x1="120" y1="40" x2="120" y2="190" stroke="#EF4444" stroke-width="1"/>
        <rect x="113" y="80" width="14" height="60" rx="2" fill="#EF4444"/>

        <line x1="165" y1="15" x2="165" y2="170" stroke="#10B981" stroke-width="1"/>
        <rect x="158" y="35" width="14" height="95" rx="2" fill="#10B981"/>

        <line x1="210" y1="30" x2="210" y2="185" stroke="#EF4444" stroke-width="1"/>
        <rect x="203" y="70" width="14" height="75" rx="2" fill="#EF4444"/>

        <line x1="255" y1="10" x2="255" y2="160" stroke="#10B981" stroke-width="1"/>
        <rect x="248" y="25" width="14" height="80" rx="2" fill="#10B981"/>
      </g>

      <!-- Trade volume strip -->
      <rect x="20" y="250" width="320" height="55" rx="6" fill="#020617" stroke="#1E293B"/>
      <text x="32" y="274" fill="#94A3B8" font-family="monospace" font-size="10">24H Volume: .84B</text>
      <text x="32" y="294" fill="#38BDF8" font-family="monospace" font-size="10">Throughput: 850,000 matches/sec</text>
    </g>

    <g transform="translate(410, 60)">
      <rect width="240" height="155" rx="8" fill="#0F172A" stroke="#1E293B"/>
      <text x="20" y="30" fill="#C7D2FE" font-family="system-ui" font-size="12" font-weight="600">Raft Consensus Cluster</text>
      <rect x="20" y="50" width="200" height="28" rx="4" fill="#1E1B4B"/>
      <text x="30" y="68" fill="#A5B4FC" font-family="monospace" font-size="11">Node 1 (Leader): 0.12ms</text>
      <rect x="20" y="84" width="200" height="28" rx="4" fill="#020617"/>
      <text x="30" y="102" fill="#94A3B8" font-family="monospace" font-size="11">Node 2 (Follower): 0.18ms</text>
      <rect x="20" y="118" width="200" height="28" rx="4" fill="#020617"/>
      <text x="30" y="136" fill="#94A3B8" font-family="monospace" font-size="11">Node 3 (Follower): 0.16ms</text>

      <rect y="170" width="240" height="155" rx="8" fill="#0F172A" stroke="#1E293B"/>
      <text x="20" y="200" fill="#C7D2FE" font-family="system-ui" font-size="12" font-weight="600">Zero-Loss Journaling</text>
      <text x="20" y="230" fill="#34D399" font-family="system-ui" font-size="24" font-weight="700">100% ACID</text>
      <text x="20" y="255" fill="#94A3B8" font-family="system-ui" font-size="11">Memory Mapped Ring Buffer</text>
      <text x="20" y="278" fill="#38BDF8" font-family="monospace" font-size="10">Deterministic Replay Verified</text>
    </g>
  </g>
</svg>