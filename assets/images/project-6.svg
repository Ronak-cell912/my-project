<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#0F172A"/>
  <defs>
    <linearGradient id="collabGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#collabGrad)"/>

  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect width="680" height="36" rx="12" fill="#0F172A"/>
    <circle cx="24" cy="18" r="5" fill="#EF4444"/>
    <circle cx="42" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="18" r="5" fill="#10B981"/>
    <text x="86" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">omnicollab-canvas / wasm-crdt-sync-engine</text>
    <rect x="545" y="10" width="115" height="18" rx="4" fill="#0284C7" fill-opacity="0.25"/>
    <text x="555" y="22" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="600">4 PEERS CONNECTED</text>

    <!-- Collaborative Canvas Viewport -->
    <rect x="25" y="55" width="420" height="340" rx="8" fill="#0F172A" stroke="#334155"/>

    <!-- Mock UI Components on Canvas -->
    <rect x="50" y="80" width="160" height="100" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="65" y="95" width="80" height="12" rx="3" fill="#38BDF8" fill-opacity="0.6"/>
    <rect x="65" y="115" width="130" height="8" rx="2" fill="#334155"/>
    <rect x="65" y="130" width="110" height="8" rx="2" fill="#334155"/>
    <rect x="65" y="150" width="50" height="16" rx="4" fill="#2563EB"/>

    <rect x="230" y="120" width="180" height="120" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="260" cy="150" r="15" fill="#10B981" fill-opacity="0.3" stroke="#10B981"/>
    <rect x="290" y="145" width="90" height="10" rx="2" fill="#334155"/>
    <rect x="250" y="180" width="140" height="40" rx="4" fill="#0F172A"/>

    <!-- Multi-user collaborative cursors -->
    <g transform="translate(180, 150)">
      <polygon points="0,0 12,18 6,18 4,24 -2,24" fill="#EC4899"/>
      <rect x="10" y="18" width="64" height="18" rx="4" fill="#EC4899"/>
      <text x="16" y="31" fill="#FFFFFF" font-family="system-ui" font-size="9" font-weight="600">Sarah M.</text>
    </g>

    <g transform="translate(340, 210)">
      <polygon points="0,0 12,18 6,18 4,24 -2,24" fill="#3B82F6"/>
      <rect x="10" y="18" width="66" height="18" rx="4" fill="#3B82F6"/>
      <text x="16" y="31" fill="#FFFFFF" font-family="system-ui" font-size="9" font-weight="600">David K.</text>
    </g>

    <!-- Side CRDT sync inspector -->
    <g transform="translate(465, 55)">
      <rect width="190" height="100" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="25" fill="#94A3B8" font-family="system-ui" font-size="11">Yjs CRDT Latency</text>
      <text x="14" y="55" fill="#F8FAFC" font-family="system-ui" font-size="22" font-weight="700">&lt; 8.2 ms</text>
      <text x="14" y="80" fill="#10B981" font-family="system-ui" font-size="11">Zero Merge Conflicts</text>

      <rect y="115" width="190" height="110" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="138" fill="#94A3B8" font-family="system-ui" font-size="11">WebAssembly Engine</text>
      <text x="14" y="165" fill="#38BDF8" font-family="system-ui" font-size="18" font-weight="700">Rust Core 60 FPS</text>
      <text x="14" y="195" fill="#94A3B8" font-family="system-ui" font-size="10">Offscreen Canvas Rendering</text>

      <rect y="240" width="190" height="100" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="265" fill="#94A3B8" font-family="system-ui" font-size="11">Concurrent Edit Log</text>
      <text x="14" y="290" fill="#34D399" font-family="monospace" font-size="10">+ Delta 0x489F applied</text>
      <text x="14" y="310" fill="#60A5FA" font-family="monospace" font-size="10">+ Vector Clock [4, 7, 2]</text>
    </g>
  </g>
</svg>